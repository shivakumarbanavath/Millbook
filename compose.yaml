services:
  millbook:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - factory-data:/app/data
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:-MillDemo2026!}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  factory-data:
